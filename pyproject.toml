[project]
name = "environment-variable-drift-watcher"
version = "0.1.1"
description = "Detects runtime changes to process environment variables and emits events when values differ from startup."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
